name: CI / CD

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose build

  migrate:
    name: Production Database Migration
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set!"
            exit 1
          fi
          NORMALIZED_URL="$DATABASE_URL"
          if [[ "$NORMALIZED_URL" == postgres://* ]]; then
            NORMALIZED_URL="postgresql+psycopg://${NORMALIZED_URL#postgres://}"
          elif [[ "$NORMALIZED_URL" == postgresql://* ]] && [[ "$NORMALIZED_URL" != postgresql+* ]]; then
            NORMALIZED_URL="postgresql+psycopg://${NORMALIZED_URL#postgresql://}"
          fi
          DATABASE_URL="$NORMALIZED_URL" alembic upgrade head

  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    needs: migrate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          HTTP_CODE=$(curl -sS -o /tmp/render-response.txt \
            -w "%{http_code}" \
            -X POST "$RENDER_DEPLOY_HOOK_URL")

          if [[ "$HTTP_CODE" != "200" && "$HTTP_CODE" != "202" ]]; then
            echo "Render deployment trigger failed: HTTP $HTTP_CODE"
            cat /tmp/render-response.txt
            exit 1
          fi

          echo "Render accepted the deployment request (HTTP $HTTP_CODE)."

      - name: Wait for Render Deployment
        run: |
          URL="https://wind-analytics-api-d6st.onrender.com/api/v1/health"

          for i in {1..20}; do
            if curl -fsS "$URL"; then
              echo "Backend is healthy."
              exit 0
            fi

            echo "Waiting for backend... ($i/20)"
            sleep 30
          done

          echo "Backend failed to become healthy within 10 minutes."
          exit 1
